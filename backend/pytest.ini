[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:pydantic

# Point pytest-postgresql at the system postgres binaries. Pg 18 is at
# /usr/lib/postgresql/18/bin/ on Ubuntu when installed via apt. Override
# with PYTEST_POSTGRESQL_EXEC for other machines.
postgresql_exec = /usr/lib/postgresql/18/bin/pg_ctl
