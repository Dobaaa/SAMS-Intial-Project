[program:sams-api]
directory=/var/www/sams/backend
command=/var/www/sams/backend/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopsignal=TERM
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
stdout_logfile=/var/log/sams/app.log
stderr_logfile=/var/log/sams/error.log
environment=PYTHONUNBUFFERED=1
